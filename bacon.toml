default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.audit]
command = ["cargo-audit", "audit"]
need_stdout = true

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.clippy]
command = [
	"cargo-clippy",
]
need_stdout = false

[jobs.nextest]
command = [
    "cargo", "nextest", "run", "--no-capture"
]
need_stdout = true
analyzer = "nextest"

[jobs.run]
command = [
    "cargo", "run",
]
env.RUST_LOG="debug"
watch = ["src"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"

[keybindings]
a = "job:audit" 
l = "job:clippy" 
r = "job:run"
t = "job:nextest"
c = "job:check" 
